# The IPU7 module requests this firmware before the root filesystem is mounted.
install_items+=" /lib/firmware/intel/ipu/ipu7ptl_fw.bin "

# The IPU7 PCI device probes before the USB camera bridge is enumerated. Keep
# its GPIO, I2C, power, and sensor drivers available in the initramfs so deferred
# camera probes can complete before the root filesystem switch.
force_drivers+=" usbio gpio_usbio i2c_usbio intel_cvs intel_skl_int3472_discrete ov08x40 "
